apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: core-mobile
  description: Core mobile wallet app for iOS and Android, published on the App Store and Google Play.
  annotations:
    github.com/project-slug: ava-labs/core-mobile
    backstage.io/source-location: url:https://github.com/ava-labs/core-mobile/tree/main/
    backstage.io/techdocs-entity: system:default/core-mobile
    backstage.io/techdocs-entity-path: /
  links:
    - url: https://apps.apple.com/app/id6443685999
      title: App Store
      icon: web
    - url: https://play.google.com/store/apps/details?id=com.avaxwallet
      title: Google Play
      icon: web
    - url: https://github.com/ava-labs/core-mobile/releases
      title: GitHub Releases
      icon: github
  tags:
    - typescript
    - react-native
    - expo
    - mobile
spec:
  type: mobile-app
  lifecycle: production
  owner: group:default/core-engineering
  system: core-mobile
