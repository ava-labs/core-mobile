    - resource:default/apple-oauth
    - resource:default/sentry
    - resource:default/walletconnect
    - resource:default/coingecko
    - resource:default/currency-api
    - resource:default/aave
    - resource:default/merkl
    - resource:default/branch
    - resource:default/coinbase-pay
