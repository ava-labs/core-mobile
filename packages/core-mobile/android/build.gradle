// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        appVersion = [
            major: 0,
            minor: 0,
            patch: 0
        ]
        // CP-15085: version identity arrives as Gradle PROPERTIES, not by rewriting
        // this file. CI previously ran `change-android-versioncode-and-versionname`,
        // which edited app/build.gradle in place every build. That changed the bytes
        // of a Gradle BUILD SCRIPT on every run, invalidating everything downstream
        // and capping the remote build-cache hit rate. As properties, a changed
        // version only invalidates the tasks that actually consume it (manifest
        // merge, BuildConfig) instead of the whole graph.
        //
        // RISKS:
        //   1. THE FALLBACKS ARE DEV-ONLY. A CI build that fails to pass
        //      -PappBuildNumber silently gets versionCode 1. Google Play rejects a
        //      non-increasing version code, so a release would fail loudly at upload
        //      rather than ship wrong — but an INTERNAL/test build would not fail,
        //      it would just be mislabelled. If a build reports version 1 anywhere
        //      it should not, a missing -P argument is the first thing to check.
        //   2. BUILD NUMBERS ARE STILL UNIQUE PER BUILD. Anything keyed on version
        //      (Datadog RUM dashboards in scripts/datadog/, crash grouping, TestRail)
        //      keeps working exactly as before. Do not "simplify" this to a constant
        //      to raise the cache hit rate — that silently corrupts those consumers.
        //   3. Both properties are strings on the command line; appBuildNumber is
        //      coerced to Integer here because versionCode must be numeric.
        appBuildNumber = (project.hasProperty('appBuildNumber')
            ? project.property('appBuildNumber').toString().toInteger()
            : 1)
        appVersionName = (project.hasProperty('appVersionName')
            ? project.property('appVersionName').toString()
            : "${appVersion.major}.${appVersion.minor}.${appVersion.patch}")
        buildToolsVersion = "36.0.0"
        minSdkVersion = 28
        compileSdkVersion = 36
        targetSdkVersion = 36
        androidXAnnotation = "1.2.0"
        androidXBrowser = "1.3.0"
        kotlinVersion = "2.1.20"
        ndkVersion = "27.1.12297006"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath 'com.google.gms:google-services:4.4.2'
    }
    subprojects { subproject ->
        afterEvaluate{
            if((subproject.plugins.hasPlugin('android') || subproject.plugins.hasPlugin('android-library'))) {
                android {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                    buildToolsVersion rootProject.ext.buildToolsVersion
                }
            }
        }
    }
}


// Ensure all CMake-compiled native libraries use 16KB page size alignment (NDK 27).
// NDK 28+ does this by default; this flag is needed for NDK 27.
subprojects { subproject ->
    afterEvaluate {
        if (subproject.plugins.hasPlugin('com.android.library') || subproject.plugins.hasPlugin('com.android.application')) {
            try {
                if (subproject.android.externalNativeBuild.cmake.path != null) {
                    subproject.android.defaultConfig.externalNativeBuild.cmake.arguments.add("-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON")
                }
            } catch (Exception ignored) {}
        }
    }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(reactNativeAndroidDir)
        }

        google() // TODO: Verify if this is needed
        maven { url("$rootDir/../node_modules/detox/Detox-android") } // This is required for detox to work
        mavenCentral()
        maven { url "$rootDir/../node_modules/expo-camera/android/maven" }
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://maven.google.com/' }
    }
    
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion rootProject.ext.kotlinVersion
            }
        }
    }
}

project.ext {
    excludeAppGlideModule = true
    glideVersion = "4.9.0"
}


apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"